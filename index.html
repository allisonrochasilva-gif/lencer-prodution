    <h1>⚀ ⚁ ⚂ Forsaken ⚃ ⚄ ⚅</h1>
    <p class="description: foraken> Forsaken é um popular jogo de terror e sobrevivência multiplayer disponível na plataforma Roblox. Ele se inspira
        na mecânica do estilo "assimetrico" (estilo Dead by Daylight), onde uma partida coloca vários jogadores em uma
        equipe para tentar sobreviver contra um único jogador que assume o papel do vilão ou caçador.

         Durante aspartidas, a dinâmica se divide claramente entre dois lados. Quem joga como Sobrevivente precisa cooperar com a
        equipe, realizar tarefas pelo mapa para acelerar o tempo de fuga e usar habilidades específicas para escapar das
        garras do inimigo.
        
        Já quem joga como Assassino tem o objetivo oposto: rastrear e eliminar todos os sobreviventes
        antes que o tempo da partida termine. O grande apelo de Forsaken no Roblox vem de seu clima de suspense,
        diversidade de personagens jogáveis e forte foco em trabalho em equipe. O jogo oferece diferentes sobreviventes
        com habilidades próprias de suporte ou defesa, além de vilões variados (muitos inspirados na própria lenda e
        história da plataforma Roblox, como John Doe e 1x1x1x1), garantindo que cada partida seja única e estratégica.
    </p>
